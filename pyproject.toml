[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medmemory"
version = "0.1.0"
description = "Hybrid KV + vector retrieval for a clinical knowledge and patient-memory assistant (educational prototype, not medical advice)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Versions are pinned to what the team tested against. Bump deliberately, in its own PR.
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "numpy>=2.0,<3",
  "httpx==0.28.1",
  "langchain-core==1.6.7",
  "xxhash==4.0.1",
]

[project.optional-dependencies]
faiss = ["faiss-cpu==1.14.3"]
eval = ["matplotlib==3.10.3"]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pre-commit==4.6.2",
]

[project.scripts]
medmemory = "medmemory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medmemory = ["py.typed", "router/lexicon/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: long-running tests (crash recovery subprocesses, benchmarks)",
  "real: needs real API keys or downloaded models; skipped in CI",
  "gpu: needs CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/medmemory"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = false
